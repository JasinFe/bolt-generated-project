# FinaKop ERP Core — application autonome sur sous-domaine.
# À copier en /etc/nginx/sites-available/finakop.conf puis lier dans sites-enabled/.
# Remplacez finakopcore.kophisgroup.com par votre hôte (le MÊME que dans le jeton de licence).

# Limiteur applicatif doux (FinaKop a son propre limiteur ; celui-ci arrête le bruit avant PHP).
limit_req_zone $binary_remote_addr zone=fkc_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=fkc_api:10m   rate=20r/s;

upstream finakop_php {
    server unix:/run/php/finakop.sock;
    keepalive 16;
}

# ── HTTP : uniquement le défi Let's Encrypt, puis redirection HTTPS ──────────
server {
    listen 80;
    listen [::]:80;
    server_name finakopcore.kophisgroup.com;

    location ^~ /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://$host$request_uri; }
}

# ── HTTPS ────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name finakopcore.kophisgroup.com;

    ssl_certificate     /etc/letsencrypt/live/finakopcore.kophisgroup.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/finakopcore.kophisgroup.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:fkc_ssl:10m;
    ssl_session_timeout 1d;

    # La racine web ne contient QUE public/index.php. Code et données sont ailleurs.
    root /srv/finakop/autonome/public;

    # FinaKop pose lui-même CSP, X-Frame-Options, noindex… (FKC_Security::boot).
    # On n'ajoute que ce qu'il ne peut pas poser : HSTS.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 64m;      # pièces justificatives, imports
    client_body_timeout  120s;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/manifest+json;

    access_log /var/log/nginx/finakop.access.log;
    error_log  /var/log/nginx/finakop.error.log warn;

    # Fichiers statiques de app/assets (FKC_ASSETS_URL = /_fkc).
    location ^~ /_fkc/ {
        alias /srv/finakop/current/app/assets/;
        location ~ \.(php|phtml|inc)$ { return 404; }
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        access_log off;
        try_files $uri =404;
    }

    # Aucun fichier caché, jamais.
    location ~ /\. { return 404; }

    location = /login {
        limit_req zone=fkc_login burst=10 nodelay;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param HTTPS on;
        fastcgi_pass finakop_php;
    }

    location ^~ /api/ {
        limit_req zone=fkc_api burst=40 nodelay;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param HTTPS on;
        fastcgi_pass finakop_php;
    }

    # Tout le reste (y compris sw.js et manifest.webmanifest, servis par l'app) → contrôleur frontal.
    location / {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param HTTPS on;
        fastcgi_pass finakop_php;
        fastcgi_read_timeout 300s;     # états lourds, clôtures, exports
        fastcgi_buffers 32 32k;
        fastcgi_buffer_size 64k;
    }
}
