# FinaKop Connect — relais temps réel (optionnel : seulement si le service Connect est vendu).
# Un seul relais pour tous vos clients. Sous-domaine dédié, WebSocket en wss://.
# À copier en /etc/nginx/sites-available/relais.conf

map $http_upgrade $fkc_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name relais.kophisgroup.com;
    location ^~ /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name relais.kophisgroup.com;

    ssl_certificate     /etc/letsencrypt/live/relais.kophisgroup.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/relais.kophisgroup.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    access_log off;   # le relais ne journalise rien ; nginx non plus.

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $fkc_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        client_max_body_size 8k;   # un signal fait quelques dizaines d'octets
    }
}
