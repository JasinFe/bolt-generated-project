; FinaKop — réglages PHP globaux (FPM et CLI).
; À copier en /etc/php/8.4/fpm/conf.d/99-finakop.ini ET /etc/php/8.4/cli/conf.d/99-finakop.ini

; ── OPcache : indispensable. ~2 100 fichiers PHP, 478 000 lignes. ──────────
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 30000
; Déploiement par bascule de lien symbolique (releases/ → current) :
; on revalide le chemin réel, et on recharge FPM à chaque déploiement.
opcache.validate_timestamps = 0
opcache.revalidate_path = 1
opcache.save_comments = 1
; JIT : gain marginal pour une application web de ce type ; laissé coupé (stabilité).
opcache.jit = disable

realpath_cache_size = 4096K
realpath_cache_ttl  = 600

; Même fuseau que sous WordPress (qui impose UTC) — FPM et CLI (cron) identiques.
date.timezone = UTC

expose_php = Off
session.use_strict_mode = 1
session.cookie_httponly = 1
session.cookie_secure   = 1
session.cookie_samesite = Lax
session.gc_maxlifetime  = 28800
