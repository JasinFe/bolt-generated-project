; FinaKop — pool PHP-FPM dédié.
; À copier en /etc/php/8.4/fpm/pool.d/finakop.conf
; Dimensionné pour un VPS 8 Go ; voir les commentaires pour 4 Go et 12+ Go.

[finakop]
user  = finakop
group = finakop

listen = /run/php/finakop.sock
listen.owner = www-data
listen.group = www-data
listen.mode  = 0660

; Un processus FinaKop consomme ~40-80 Mo (478 000 lignes, OPcache partagé à part).
;   VPS 4 Go  : max_children = 12
;   VPS 8 Go  : max_children = 24
;   VPS 12 Go : max_children = 40
pm = dynamic
pm.max_children      = 24
pm.start_servers     = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8
pm.max_requests      = 1000

request_terminate_timeout = 300s
request_slowlog_timeout   = 5s
slowlog = /var/log/finakop/php-slow.log

; Le pool ne voit que ce dont il a besoin.
php_admin_value[open_basedir]    = /srv/finakop/:/var/lib/finakop/:/var/cache/finakop/:/etc/finakop/:/tmp/:/usr/share/zoneinfo/
php_admin_value[error_log]       = /var/log/finakop/php-error.log
php_admin_flag[log_errors]       = on
php_admin_flag[display_errors]   = off
php_admin_value[memory_limit]    = 512M
php_admin_value[upload_max_filesize] = 64M
php_admin_value[post_max_size]       = 64M
php_admin_value[max_execution_time]  = 300
php_admin_value[session.save_path]   = /var/lib/finakop/sessions
; Debian coupe le ramasse-miettes des sessions (gc_probability=0) : on le rallume pour ce dossier.
php_admin_value[session.gc_probability] = 1
php_admin_value[session.gc_divisor]     = 1000
php_admin_value[sendmail_path]       = "/usr/bin/msmtp -t -i"
; WordPress force l'UTC pour PHP : on garde EXACTEMENT ce comportement, pour que les
; dates calculées par FinaKop (échéances, horodatages, temporisation) ne bougent pas.
php_admin_value[date.timezone]       = UTC
